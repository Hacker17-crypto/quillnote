name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: windows
            glob: release/*.exe
          - os: macos-latest
            script: dist:mac
            artifact: macos
            glob: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ matrix.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ matrix.os }}-

      - run: npm ci

      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ github.token }}

      - name: Verify installer was produced
        shell: bash
        run: |
          ls -la release
          test -n "$(ls release/*.exe 2>/dev/null || ls release/*.dmg 2>/dev/null)" || {
            echo "No installer artifact found" >&2
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          ls -la dist
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" dist/* --title "Quillnote ${VERSION}" --target "$GITHUB_SHA" \
            --notes "Windows installer (.exe) and macOS disk images (.dmg, Apple Silicon and Intel). Builds are unsigned: on macOS right-click the app and choose Open the first time."
