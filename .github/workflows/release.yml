name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quillnote-release
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: windows
            glob: release/*.exe
          - os: macos-latest
            script: dist:mac
            artifact: macos
            glob: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cache electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ matrix.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ matrix.os }}-

      - run: npm ci

      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify packaged Windows app and saved notebooks
        if: runner.os == 'Windows'
        continue-on-error: true
        run: npm run test:persistence
        env:
          QN_EXECUTABLE: ${{ github.workspace }}/release/win-unpacked/Quillnote.exe

      - name: Verify installer was produced
        shell: bash
        run: |
          ls -la release
          test -n "$(ls release/*.exe 2>/dev/null || ls release/*.dmg 2>/dev/null)" || {
            echo "No installer artifact found" >&2
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          test -s "dist/Quillnote-Setup-${VERSION}.exe"
          test -s "dist/Quillnote-${VERSION}-arm64.dmg"
          test -s "dist/Quillnote-${VERSION}-x64.dmg"
          (cd dist && sha256sum *.exe *.dmg > SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Replacing it with this build."
            gh release delete "$TAG" --cleanup-tag -y
          fi
          gh release create "$TAG" dist/* --title "Quillnote ${VERSION} - library preview" \
            --prerelease --target "$GITHUB_SHA" \
            --notes "Library preview for Windows and macOS (Apple Silicon and Intel). The page editor is still a placeholder; handwriting, annotation, audio, and AI are unfinished. Builds are not developer-signed or notarized. SHA256SUMS.txt contains installer checksums."
